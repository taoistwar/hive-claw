[package]
name = "hivegui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HiveGUI: desktop client for HiveClaw with Day+1 / Hour+1 helper tool sections"

[profile.dev]
debug = true
opt-level = 0

[profile.test]
debug = true

[[bin]]
name = "hivegui"
path = "src/main.rs"



[lib]
name = "hivegui"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
mysql_async = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
wasmparser = "0.221"
extism = "1"
hive-builtins = { path = "../hive-builtins" }
providers = { path = "../providers" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true }
wat = "1"
