[workspace]
resolver = "2"
members = [
    "crates/agent",
    "crates/api",
    "crates/bus",
    "crates/channels",
    "crates/cli",
    "crates/command",
    "crates/config",
    "crates/cron",
    "crates/heartbeat",
    "crates/providers",
    "crates/security",
    "crates/session",
    "crates/skills",
    "crates/templates",
    "crates/utils",
    "crates/hive-builtins",
    "crates/hiveclaw",
    "crates/hivegui",
    "crates/hiveweb",
    "plugins/smoke-plugin",
]
# `default-members` keeps `cargo build` / `cargo test` (no args) scoped to
# HiveClaw, so the service side stays iterable on machines without the
# system libraries gpui needs (libxkbcommon, libwayland, libvulkan).
# Explicit `cargo build -p hivegui` or `cargo build --workspace` still
# builds the desktop crate.
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/taoistwar/hive-claw"

[workspace.dependencies]
# HTTP / async (HiveClaw)
axum = { version = "0.8", default-features = false, features = [
    "macros",
    "tokio",
    "http1",
    "json",
    "multipart",
] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.6", features = [
    "limit",
    "trace",
    "request-id",
    "util",
] }

# HTTP client (HiveGUI)
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "multipart",
] }
eventsource-stream = "0.2"

# Desktop UI (HiveGUI). Pulled from Zed's main branch — gpui is not on crates.io.
# Version pinned to match the `zed` submodule commit.
# `gpui_platform` provides the `application()` constructor that picks the right
# platform backend (macOS / Linux / web) without #[cfg] gating at the callsite.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["font-kit"] , rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
# Serde / JSON
base64 = "0.22"
mime_guess = { version = "2", features = ["rev-mappings"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Misc
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
once_cell = "1.19"
directories = "5"
futures = "0.3"
url = "2"
bytes = "1"
unicode-segmentation = "1"

# Dev-only
assert_cmd = "2"

# Data source management (HiveGUI)
mysql_async = "0.34"
sqlx = { version = "0.8", default-features = false, features = [
    "derive",
    "runtime-tokio-native-tls",
    "sqlite",
    "mysql",
    "chrono",
    "rust_decimal",
] }
rust_decimal = "1.33"
chacha20poly1305 = "0.10"
zeroize = "1"
dirs = "5"
syntect = "5"

# Admin center (hiveweb)
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = "9"
bcrypt = "0.15"
aws-sdk-s3 = "1"
aws-config = "1"
dotenvy = "0.15"


regex = "1"
aho-corasick = "1"
async-trait = "0.1"


fs2 = "0.4"
include_dir = "0.7"
serde_yaml = "0.9"
sha2 = "0.10"
walkdir = "2"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
rustyline = "15"
env_logger = "0.11"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
