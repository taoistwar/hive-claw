name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
          docker system df

      - name: Install system dependencies for gpui (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential \
            libfontconfig-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev
          pkg-config --exists fontconfig xkbcommon xkbcommon-x11

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup show

          expected_release="release: 1.95.0"
          rustc_details="$(rustc --version --verbose)"
          cargo_details="$(cargo --version --verbose)"

          printf '%s\n' "$rustc_details"
          printf '%s\n' "$cargo_details"

          if ! grep -Fqx -- "$expected_release" <<<"$rustc_details"; then
            echo "::error::expected rustc 1.95.0" >&2
            exit 1
          fi

          if ! grep -Fqx -- "$expected_release" <<<"$cargo_details"; then
            echo "::error::expected cargo 1.95.0" >&2
            exit 1
          fi

      - name: Cache cargo registry & sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test (workspace except HiveWeb)
        run: cargo test --locked --workspace --exclude hiveweb

      - name: cargo test (HiveWeb lib + bins)
        run: cargo test --locked -p hiveweb --lib --bins

      - name: cargo check (HiveWeb developer binaries)
        run: cargo check --locked -p hiveweb --bin api-test --bin seed --bin seed-bench

      - name: cargo test (HiveWeb docs)
        run: cargo test --locked -p hiveweb --doc

  hiveweb-integration:
    name: hiveweb integration
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: mysql://hiveweb:hiveweb_test_password@127.0.0.1:3306/hiveweb_test
      TEST_EXTERNAL_DATABASE_URL: mysql://hiveweb:hiveweb_test_password@127.0.0.1:3306/hiveweb_test_external
      REDIS_MODE: direct
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_CONNECT_TIMEOUT_MS: "5000"
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: hiveweb-test
      APP_ENV: test
      JWT_ADMIN_SECRET: ci-admin-secret
      JWT_USER_SECRET: ci-user-secret
      ASSISTANT_SECRET: ci-assistant-secret
      PLUGIN_SYSTEM_ENABLED: "true"
      RUST_BACKTRACE: "1"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: hiveweb_test_root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: hiveweb_test
          MYSQL_USER: hiveweb
          MYSQL_PASSWORD: hiveweb_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -phiveweb_test_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
          docker system df

      - name: Install HiveWeb system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libssl-dev

      - name: Show selected Rust toolchain
        run: rustup show

      - name: Cache cargo registry & sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-hiveweb-integration-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Start MinIO and create test bucket
        shell: bash
        run: |
          docker run --detach --name hiveweb-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="${AWS_ACCESS_KEY_ID}" \
            --env MINIO_ROOT_PASSWORD="${AWS_SECRET_ACCESS_KEY}" \
            minio/minio:RELEASE.2025-07-18T21-56-31Z server /data

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs hiveweb-ci-minio
              exit 1
            fi
            sleep 2
          done

          docker run --rm --network host \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env S3_BUCKET \
            --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z -c '
              mc alias set ci http://127.0.0.1:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
              mc mb --ignore-existing "ci/$S3_BUCKET"
            '

      - name: Create disposable external game database
        run: |
          docker run --rm --network host \
            --env MYSQL_PWD=hiveweb_test_root \
            mysql:8.0 \
            mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root \
              --execute="
                CREATE DATABASE IF NOT EXISTS hiveweb_test_external;
                GRANT ALL PRIVILEGES ON hiveweb_test_external.* TO 'hiveweb'@'%';
                FLUSH PRIVILEGES;
              "

      - name: Build migration binary
        run: cargo build --locked -p hiveweb --bin migrate

      - name: Migrate disposable database from clean cwd
        shell: bash
        run: |
          migrate_cwd="$(mktemp -d "${RUNNER_TEMP}/hiveweb-migrate.XXXXXX")"
          case "${TEST_DATABASE_URL}" in
            mysql://*) ;;
            *)
              echo "TEST_DATABASE_URL must use the mysql:// scheme" >&2
              exit 1
              ;;
          esac

          database_authority="${TEST_DATABASE_URL#mysql://}"
          database_authority="${database_authority%%/*}"
          database_endpoint="${database_authority##*@}"
          case "${database_endpoint}" in
            127.0.0.1|127.0.0.1:*|localhost|localhost:*|\[::1\]|\[::1\]:*) ;;
            *)
              echo "TEST_DATABASE_URL must use a loopback MySQL host" >&2
              exit 1
              ;;
          esac

          case "${TEST_DATABASE_URL%%\?*}" in
            */hiveweb_test|*/hiveweb_test_*) ;;
            *)
              echo "TEST_DATABASE_URL must target hiveweb_test or hiveweb_test_*" >&2
              exit 1
              ;;
          esac

          probe_dir="${migrate_cwd}"
          while true; do
            test ! -e "${probe_dir}/.env"
            parent_dir="$(dirname "${probe_dir}")"
            if [ "${parent_dir}" = "${probe_dir}" ]; then
              break
            fi
            probe_dir="${parent_dir}"
          done

          (
            cd "${migrate_cwd}"
            DATABASE_URL="${TEST_DATABASE_URL}" \
              "${GITHUB_WORKSPACE}/target/debug/migrate"
          )

      - name: cargo test (HiveWeb integration)
        run: cargo test --locked -p hiveweb --tests -- --test-threads=1
