[package]
name = "hivegui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HiveGUI: desktop client for HiveClaw with Day+1 / Hour+1 helper tool sections"

[profile.dev]
debug = true
opt-level = 0

[profile.test]
debug = true

[[bin]]
name = "hivegui"
path = "src/main.rs"

[[bench]]
name = "local_runtime"
path = "benches/local_runtime.rs"
harness = false

[lib]
name = "hivegui"
path = "src/lib.rs"

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true, features = [
    "tree-sitter-javascript",
    "tree-sitter-rust",
] }
gpui-component-assets = { workspace = true }
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
mysql_async = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "macros", "runtime-tokio", "sqlite"] }
chacha20poly1305 = { workspace = true }
zeroize = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
wasmparser = "0.221"
extism = { workspace = true }
age = { workspace = true }
tar = { workspace = true }
flate2 = "=1.1.9"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
parking_lot = "0.12"
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }
fnv = "1"
hive-builtins = { path = "../hive-builtins" }
providers = { path = "../providers" }
hive-runtime-core = { path = "../hive-runtime-core" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
tokio = { workspace = true }
wat = "1"

# Feature 011 (HiveGUI standalone mode) is built incrementally. The integration
# test harnesses reference scaffolding (e.g. WIP contract trails, visual-test
# contexts) that is not yet wired into a call path. Suppress `dead_code` for this
# package so the `-D warnings` quality gate can pass during the build-out.
# `dead_code` is a rustc lint, not a clippy lint, so it lives under `[lints.rust]`.
[lints.rust]
dead_code = "allow"
