name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: fmt + clippy + test
    runs-on: ubuntu-latest

    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "f8a30ec64d4e7a0a3a8c5e0a4f6f3b1e7a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d"
      CARGO_DENY_VERSION: "0.20.2"
      SQLX_CLI_VERSION: "0.9.0"
      MYSQL_ASYNC_VERSION: "0.36.2"
      SQLX_VERSION: "0.9.0"
      AWS_SDK_S3_VERSION: "1.133.0"
      VENDORED_WAYLAND_SCANNER_VERSION: "0.31.10"

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Install system dependencies for gpui (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config build-essential \
            libxkbcommon-dev libwayland-dev libvulkan-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry & target
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Gitleaks release download
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          ARCH="linux-amd64"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${ARCH}.tar.gz" \
            -o gitleaks.tar.gz
          echo "GITLEAKS_SHA256=placeholder_digest_for_test_purposes_only_aaaaaaaaaaaaaaaaaa" > gitleaks.sha256

      - name: Gitleaks checksum verification
        env:
          GITLEAKS_SHA256: "f8a30ec64d4e7a0a3a8c5e0a4f6f3b1e7a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d"
        run: |
          set -euo pipefail
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check

      - name: Gitleaks installation
        run: |
          set -euo pipefail
          tar -xzf gitleaks.tar.gz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks secret scan
        run: |
          set -euo pipefail
          gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      - name: cargo-deny installation
        env:
          CARGO_DENY_VERSION: "0.20.2"
        run: cargo install --locked cargo-deny --version "0.20.2"

      - name: dependency advisory scan
        run: cargo deny check advisories

      - name: cargo-sqlx installation
        env:
          SQLX_CLI_VERSION: "0.9.0"
        run: |
          cargo install --locked sqlx-cli \
            --version "0.9.0" \
            --no-default-features \
            --features sqlite,mysql,rustls

      - name: SQLx offline metadata freshness check
        env:
          SQLX_OFFLINE: "true"
        run: SQLX_OFFLINE=true cargo sqlx prepare --workspace --check

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
